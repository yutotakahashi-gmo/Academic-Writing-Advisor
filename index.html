<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Writing Advisor</title>
<meta name="description" content="英検1級・アカデミックライティング向けパラフレーズ＆語彙トレーナー">
<meta name="theme-color" content="#0f172a">
<!-- Favicon: PNG for Safari, ICO fallback, SVG for modern browsers -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<!-- iOS / iPadOS / Safari -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Advisor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Safari pinned tabs (macOS) -->
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#dc2626">
<!-- PWA manifest -->
<link rel="manifest" href="site.webmanifest">
<style>
  /* ============================================
     DISTINCTION style — Atsueigo-inspired
     White / Navy / Red palette
     ============================================ */
  :root {
    --bg: #ffffff;
    --bg-alt: #fafaf7;
    --surface: #ffffff;
    --surface-2: #f5f5f1;
    --text: #0f172a;           /* near-black navy */
    --text-2: #334155;
    --text-muted: #64748b;
    --accent: #0f172a;          /* navy = primary text/word color */
    --accent-soft: #e2e8f0;
    --accent-dark: #020617;
    --highlight: #dc2626;       /* red accent */
    --highlight-soft: #fef2f2;
    --highlight-dark: #991b1b;
    --warning: #b45309;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --success: #166534;
    --success-soft: #f0fdf4;
    --error: #991b1b;
    --error-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(15,23,42,0.04);
    --radius: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0e;
      --bg-alt: #131316;
      --surface: #16161a;
      --surface-2: #1f1f24;
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #f1f5f9;
      --accent-soft: #1e293b;
      --accent-dark: #ffffff;
      --highlight: #f87171;
      --highlight-soft: #2a0e0e;
      --highlight-dark: #fca5a5;
      --warning: #fbbf24;
      --border: #2a2a2e;
      --border-strong: #3a3a3e;
      --success: #4ade80;
      --success-soft: #14322c;
      --error: #f87171;
      --error-soft: #2a0e0e;
      --shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern", "liga", "ss01";
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 24px 90px;
  }
  /* ---- HEADER (brand bar) ---- */
  header {
    text-align: left;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--text);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
    font-weight: 800;
    line-height: 1.15;
  }
  h1 .red { color: var(--highlight); }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 700;
    margin: 0;
  }

  /* ---- STATS BAR (status strip) ---- */
  .stats-bar {
    display: flex;
    gap: 28px;
    justify-content: flex-start;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--surface-2);
    border-left: 3px solid var(--text);
  }
  .stat {
    background: transparent;
    padding: 0;
    border-radius: 0;
    font-size: 0.7rem;
    border: none;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }
  .stat strong {
    color: var(--text);
    font-weight: 800;
    font-size: 0.95rem;
    margin-left: 6px;
    font-feature-settings: "tnum";
  }
  .stat.accent strong { color: var(--highlight); }

  /* ---- CONTROLS (filter rows) ---- */
  .controls {
    background: transparent;
    border-radius: 0;
    padding: 0;
    margin-bottom: 24px;
    box-shadow: none;
    border: none;
  }
  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .control-row:last-child { border-bottom: none; }
  .control-row + .control-row { margin-top: 0; }
  .control-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-right: 12px;
    min-width: 64px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .chip {
    padding: 5px 11px;
    border-radius: 3px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.82rem;
    transition: all 0.12s ease;
    font-family: inherit;
    font-weight: 500;
  }
  .chip:hover {
    color: var(--text);
    background: var(--surface-2);
  }
  .chip.active {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
    font-weight: 600;
  }
  .chip.active:hover { color: var(--bg); background: var(--text); }

  /* ---- CARD (entry container) ---- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 36px 32px 32px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    min-height: 380px;
    display: flex;
    flex-direction: column;
  }
  /* Roomier padding for eiken / list (long-form content) */
  .card.list-mode {
    padding: 40px 40px 48px;
  }

  /* ---- WORD HEADER (dictionary entry style) ---- */
  .word-header {
    text-align: left;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--border-strong);
  }
  .word-category {
    font-size: 0.66rem;
    color: var(--highlight);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 800;
    font-style: italic;
  }
  .word-main {
    font-size: 2.6rem;
    font-weight: 900;
    letter-spacing: -0.025em;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.05;
    display: inline-block;
    border-bottom: 3px solid var(--highlight);
    padding-bottom: 2px;
  }
  .word-jp {
    color: var(--text-2);
    font-size: 0.98rem;
    margin-top: 10px;
    font-weight: 500;
  }

  /* ---- PARAPHRASES ---- */
  .paraphrases {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 7px;
    justify-content: flex-start;
    margin-top: 18px;
  }
  .para-pill {
    background: var(--surface);
    padding: 5px 11px;
    border-radius: 3px;
    font-size: 0.93rem;
    border: 1px solid var(--border-strong);
    color: var(--text);
    transition: all 0.12s ease;
    font-weight: 500;
  }
  .para-pill.advanced {
    background: var(--highlight-soft);
    color: var(--highlight-dark);
    border-color: var(--highlight);
    font-weight: 700;
    border-bottom-width: 2px;
  }
  .para-pill.hidden { filter: blur(8px); user-select: none; }

  /* ---- QUIZ ---- */
  .quiz-question {
    text-align: left;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--border-strong);
  }
  .quiz-prompt {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
  }
  .quiz-target {
    font-size: 2.1rem;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 4px;
    display: inline-block;
    border-bottom: 3px solid var(--highlight);
    padding-bottom: 2px;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .quiz-target-jp {
    color: var(--text-2);
    font-size: 0.9rem;
    margin-top: 10px;
  }

  .quiz-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  @media (max-width: 600px) {
    .quiz-choices { grid-template-columns: 1fr; }
  }
  .choice {
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    transition: all 0.12s ease;
  }
  .choice:hover:not(:disabled) {
    border-color: var(--text);
    background: var(--surface-2);
  }
  .choice.correct {
    background: var(--success-soft);
    border-color: var(--success);
    border-left: 4px solid var(--success);
    color: var(--success);
    font-weight: 600;
  }
  .choice.wrong {
    background: var(--error-soft);
    border-color: var(--error);
    border-left: 4px solid var(--error);
    color: var(--error);
  }
  .choice:disabled { cursor: default; }

  .typing-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.12s;
  }
  .typing-input:focus { border-color: var(--text); }
  .typing-feedback {
    min-height: 24px;
    text-align: center;
    margin-top: 8px;
    font-size: 0.9rem;
  }
  .typing-feedback.correct { color: var(--success); }
  .typing-feedback.partial { color: var(--accent); }
  .typing-feedback.wrong { color: var(--error); }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: auto;
    padding-top: 20px;
  }
  /* ---- BUTTONS ---- */
  .btn {
    padding: 9px 18px;
    border-radius: 4px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 0.84rem;
    font-family: inherit;
    transition: all 0.12s ease;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .btn:hover { border-color: var(--text); background: var(--surface-2); }
  .btn.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .btn.primary:hover {
    background: var(--highlight);
    color: white;
    border-color: var(--highlight);
  }
  .btn.ghost {
    border-color: transparent;
    color: var(--text-muted);
    background: transparent;
  }
  .btn.ghost:hover {
    color: var(--text);
    background: var(--surface-2);
  }

  .progress-track {
    height: 2px;
    background: var(--border);
    border-radius: 0;
    overflow: hidden;
    margin: 6px 0 14px;
  }
  .progress-fill {
    height: 100%;
    background: var(--highlight);
    transition: width 0.3s ease;
  }

  .mode-banner {
    text-align: left;
    padding: 7px 12px;
    background: var(--highlight-soft);
    color: var(--highlight-dark);
    border-left: 3px solid var(--highlight);
    border-radius: 0;
    font-size: 0.72rem;
    margin-bottom: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* legend block hidden (no longer used in DOM) */
  .legend, .legend-item, .legend-dot { display: none; }
  /* .eiken-example uses <details> and must remain visible */
  details.eiken-example { display: block; }

  /* ---- CHOICE KEY (A/B/C/D) ---- */
  .choice {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .choice-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    font-size: 0.74rem;
    font-weight: 800;
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .choice:hover:not(:disabled) .choice-key {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .choice.correct .choice-key { background: var(--success); color: white; border-color: var(--success); }
  .choice.wrong .choice-key { background: var(--error); color: white; border-color: var(--error); }
  .choice-body { flex: 1; text-align: left; }
  .choice-jp { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

  /* ---- KEYBOARD HINT BAR ---- */
  .kbd-hints {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border-strong);
    padding: 8px 16px;
    font-size: 0.72rem;
    color: var(--text-muted);
    text-align: center;
    z-index: 50;
    letter-spacing: 0.03em;
  }
  .kbd-hints kbd {
    display: inline-block;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 0.72rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text);
    margin: 0 1px;
    font-weight: 600;
  }
  .kbd-sep { color: var(--border-strong); margin: 0 8px; }

  /* ---- TOAST ---- */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--text);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 3px;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .history-pos {
    font-size: 0.66rem;
    color: var(--text-muted);
    text-align: right;
    margin-bottom: 6px;
    font-family: ui-monospace, monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ---- PARAPHRASE COUNT BADGE ---- */
  .para-count {
    display: inline-block;
    background: transparent;
    border: none;
    border-left: 2px solid var(--text);
    color: var(--text-muted);
    padding: 2px 10px;
    border-radius: 0;
    font-size: 0.7rem;
    font-weight: 700;
    margin-top: 12px;
    font-family: ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .para-count strong { color: var(--text); font-weight: 800; }

  /* ---- HINT PILL (first-letter hint) ---- */
  .hint-pill {
    background: var(--surface);
    padding: 5px 11px;
    border-radius: 3px;
    font-size: 0.93rem;
    border: 1px dashed var(--border-strong);
    color: var(--text-muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.06em;
  }
  .hint-pill .hint-initial {
    color: var(--highlight);
    font-weight: 800;
    margin-right: 1px;
  }
  .hint-pill.advanced {
    border-color: var(--highlight);
    border-style: dashed;
    background: var(--highlight-soft);
    opacity: 0.85;
  }

  /* ---- LIST (column) MODE ---- */
  .list-search {
    width: 100%;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-size: 0.92rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.12s;
  }
  .list-search:focus { border-color: var(--text); }

  .list-summary {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .list-entry {
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
  }
  .list-entry:last-child { border-bottom: none; }
  .list-entry-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .list-entry-base {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.015em;
    border-bottom: 2px solid var(--highlight);
    padding-bottom: 1px;
  }
  .list-entry-jp {
    font-size: 0.82rem;
    color: var(--text-2);
    font-weight: 500;
  }
  .list-entry-meta {
    margin-left: auto;
    font-size: 0.66rem;
    color: var(--text-muted);
    font-family: ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .list-entry-meta .marked {
    background: var(--highlight);
    color: white;
    padding: 1px 7px;
    border-radius: 2px;
    margin-left: 6px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .list-entry-paras {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .list-entry-paras .para-pill {
    font-size: 0.86rem;
    padding: 4px 10px;
  }
  .list-pos-section {
    margin: 20px 0 10px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--text);
    font-size: 0.7rem;
    color: var(--text);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
  }
  .list-pos-section:first-child { margin-top: 0; }
  .list-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* Override card min-height for list */
  .card.list-mode {
    min-height: auto;
  }

  /* ---- EIKEN sub-nav (inside card) ---- */
  .eiken-nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    padding: 0 0 16px;
    margin: -8px 0 16px;
    border-bottom: 2px solid var(--text);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 10;
  }
  .eiken-nav-btn {
    padding: 8px 14px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 4px 4px 0 0;
    transition: all 0.12s ease;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .eiken-nav-btn:hover {
    color: var(--text);
    background: var(--surface-2);
  }
  .eiken-nav-btn.active {
    color: var(--text);
    background: transparent;
    border-bottom-color: var(--highlight);
    font-weight: 800;
  }

  /* ---- Example tabs (Summary + Essay switcher) ---- */
  .ex-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    margin: 14px 0 4px;
  }
  .ex-tab-group-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    min-width: 72px;
  }
  .ex-tab {
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.83rem;
    font-family: inherit;
    font-weight: 600;
    border-radius: 4px;
    transition: all 0.12s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ex-tab:hover {
    border-color: var(--text);
    color: var(--text);
    background: var(--surface-2);
  }
  .ex-tab.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .ex-tab-meta {
    font-size: 0.7rem;
    opacity: 0.7;
    font-family: ui-monospace, monospace;
    font-weight: 500;
  }

  /* ---- Example content (Summary/Essay body) ---- */
  .ex-content {
    margin-top: 32px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }
  .ex-header {
    margin-bottom: 18px;
  }
  .ex-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .ex-en {

    font-size: 0.95rem;

    color: var(--text);
    font-style: italic;

    flex-wrap: wrap;
    margin: 16px 0 28px;

    color: var(--highlight-dark);

    font-size: 0.82rem;
    font-weight: 700;
    border: 1px solid var(--highlight);
    letter-spacing: 0.02em;
  }
  /* Roomy essay body with generous paragraph spacing */
  .ex-essay {
    background: var(--surface);
    padding: 16px 0 8px;
    line-height: 2.0;
    font-size: 0.98rem;
    color: var(--text);
  }
  .ex-paragraph {
    margin-bottom: 42px;
  }
  .ex-paragraph:last-child {
    margin-bottom: 0;
  }
  .ex-paragraph p {
    margin: 0;
    padding-left: 16px;
    border-left: 2px solid var(--border);
  }
  .ex-label {
    display: inline-block;
    background: var(--highlight);
    color: white;
    font-weight: 800;
    font-size: 0.78rem;
    padding: 5px 14px;
    border-radius: 3px;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
    font-family: ui-monospace, monospace;
    text-transform: uppercase;
  }
  /* For summary: simple paragraph (no label) */
  .ex-essay > p.ex-paragraph {
    padding-left: 18px;
    border-left: 3px solid var(--accent-soft);
    margin-bottom: 32px;
  }
  /* eiken-slot-table: more spacing */
  .eiken-slot-table th, .eiken-slot-table td {
    padding: 10px 14px;
  }

  /* ---- CORRECTION TAB (添削) ---- */
  /* Highlighter pen style — Atsueigo-inspired */
  .essay-highlight {
    background: #fff3bf;     /* light yellow */
    color: #1c1917;
    padding: 1px 3px;
    border-bottom: 3px solid #fcc419;   /* golden yellow underline */
    font-weight: 500;
    /* preserve breaking */
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  @media (prefers-color-scheme: dark) {
    .essay-highlight {
      background: #fff3bf;
      color: #18181b;
      border-bottom-color: #fcc419;
    }

  .correction-essay {
    line-height: 2.0;
    font-size: 1rem;
    color: var(--text);
    padding: 8px 0;
  }
  .correction-para {
    margin: 0 0 32px;
    padding-left: 18px;
    border-left: 3px solid var(--accent-soft);
  }
  .correction-para:last-child { margin-bottom: 0; }

  .err-group {
    margin: 16px 0 24px;
  }
  .err-group-title {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--highlight);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding-bottom: 4px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .err-row {
    display: grid;
    grid-template-columns: 1fr 24px 1fr;
    gap: 8px 10px;
    padding: 8px 10px;
    border-bottom: 1px dotted var(--border);
    font-size: 0.88rem;
    align-items: start;
    line-height: 1.55;

  .err-row:last-child { border-bottom: none; }

    font-size: 0.85rem;

    text-decoration-color: var(--error);
    text-decoration-thickness: 1px;

  .err-arrow {
    color: var(--text-muted);
    text-align: center;
    font-weight: 700;
  }
  .err-right {
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.85rem;
  }
  @media (max-width: 600px) {
    .err-row { grid-template-columns: 1fr; }

    display: inline-block;

    background: var(--surface-2);
    border-left: 3px solid var(--text);
    padding: 12px 16px;
    margin: 10px 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.84rem;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .eiken-slot {
    color: var(--highlight);
    font-weight: 700;
    background: var(--highlight-soft);
    padding: 0 4px;
    border-radius: 2px;
  }
  .eiken-fixed {
    color: var(--text);
    font-weight: 600;
  }

    list-style: none;
    padding: 0;
    margin: 8px 0;
  }
  .eiken-skel-list li {
    padding: 6px 12px;
    border-left: 2px solid var(--highlight);
    margin: 6px 0;
    background: var(--highlight-soft);
    font-size: 0.88rem;
    color: var(--text);
    font-style: italic;
  }
  .eiken-example {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px;
    margin: 12px 0;
    background: var(--surface);
  }
  .eiken-example summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text);
    user-select: none;
    list-style: none;
  }
  .eiken-example summary::before {
    content: "▶ ";
    color: var(--highlight);
    font-size: 0.7rem;
    margin-right: 4px;
  }
  .eiken-example[open] summary::before { content: "▼ "; }
  .eiken-example[open] summary { margin-bottom: 12px; }
  .eiken-slot-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 12px;
    font-size: 0.85rem;
  }
  .eiken-slot-table th, .eiken-slot-table td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .eiken-slot-table th {
    width: 40px;
    font-weight: 800;
    color: var(--highlight);
    background: var(--surface-2);
  }
  .eiken-completed {
    background: var(--bg-alt);
    border-left: 3px solid var(--highlight);
    padding: 12px 14px;
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--text);
    margin: 8px 0;
  }
  .eiken-completed strong { color: var(--highlight); }
  .eiken-tip {
    font-size: 0.82rem;

    border-left: 2px solid var(--border-strong);

    background: var(--surface-2);
  }
  .eiken-word-count {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--text);
    color: var(--bg);

    border-radius: 2px;
    margin-left: 8px;
    font-family: ui-monospace, monospace;
    letter-spacing: 0.04em;
    font-weight: 700;
    vertical-align: middle;
  }
  .eiken-vocab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    font-size: 0.85rem;
    margin-top: 6px;
  }
  @media (max-width: 600px) { .eiken-vocab-grid { grid-template-columns: 1fr; } }
  .eiken-vocab-item {
    padding: 4px 8px;
    border-bottom: 1px dotted var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;

  .eiken-vocab-item .ev-src {
    font-size: 0.66rem;
    color: var(--text-muted);
    font-family: ui-monospace, monospace;
    margin-left: 4px;
  }

</head>
<body>
<div class="container">

<div class="controls">

  </div>

</div>

<div class="history-pos" id="history-pos"></div>
<div class="card" id="card">

</div>

<div class="toast" id="toast"></div>

<script>

// ============================================
// STATE
// ============================================
const STORAGE_KEY = "paraphrase_master_v1";
const defaultState = {
  mode: "list",
  source: "all",
  topic: "all",
  pos: "all",
  level: "all",
  eikenTab: "templates",  // "templates" | "examples" | "reasons" | "correction" | "words"
  eikenExample: "essay-aid",
  correctionTab: "essay",  // "essay" | "summary"
  seen: 0,
  correct: 0,
  streak: 0,
  wordStats: {},
  currentIdx: -1,
};
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...defaultState };
    const parsed = JSON.parse(raw);
    // Migrate removed modes/sources to supported ones
    const validModes = ["eiken", "list"];
    if (!validModes.includes(parsed.mode)) parsed.mode = "list";
    const validSources = ["all", "paraphrase", "topic"];
    if (!validSources.includes(parsed.source)) parsed.source = "all";
    return { ...defaultState, ...parsed };
  } catch (e) { return { ...defaultState }; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function getStat(base) {
  if (!state.wordStats[base]) state.wordStats[base] = { seen: 0, correct: 0, marked: false };
  return state.wordStats[base];
}

// ============================================
// FILTERING
// ============================================
// Merged vocab pool: paraphrase entries + topic/eiken term entries
const ALL_VOCAB = [...VOCAB, ...EXTRA_VOCAB];

function filteredVocab() {
  return ALL_VOCAB.filter(v => {
    const src = v.source || "paraphrase";
    if (state.source !== "all" && state.source !== src) return false;
    if (state.topic !== "all" && v.topic !== state.topic) return false;
    // POS filter: only applies to paraphrase entries (terms have pos="term")
    if (state.pos !== "all" && src === "paraphrase" && v.pos !== state.pos) return false;
    if (state.pos !== "all" && src !== "paraphrase" && state.pos !== "term") return false;
    // Level filter:
    // - "advanced": paraphrase needs non-empty advanced[]; ALL term entries qualify (英検1級・トピック語は元々上級語彙)
    // - "weak": only marked words
    if (state.level === "advanced") {
      if (src === "paraphrase" && (!v.advanced || v.advanced.length === 0)) return false;
    }
    if (state.level === "weak") {
      const s = state.wordStats[v.base];
      if (!s || !s.marked) return false;
    }
    return true;
  });
}

function availableTopics() {
  const set = new Set();
  ALL_VOCAB.forEach(v => {
    if (!v.topic) return;
    // Eiken is already represented in the source row, so skip it as a topic chip
    if (v.source === "eiken") return;
    if (state.source === "all" || (v.source || "paraphrase") === state.source) {
      set.add(v.topic);
    }
  });
  return [...set].sort();
}

function pickRandom() {
  const pool = filteredVocab();
  if (pool.length === 0) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickRandomOther(excludeBase) {
  const pool = VOCAB.filter(v => v.base !== excludeBase);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ============================================
// RENDER
// ============================================
const cardEl = document.getElementById("card");
const banner = document.getElementById("mode-banner");

function updateStats() {
  document.getElementById("stat-seen").textContent = state.seen;
  document.getElementById("stat-correct").textContent = state.correct;
  const rate = state.seen > 0 ? Math.round((state.correct / state.seen) * 100) + "%" : "—";
  document.getElementById("stat-rate").textContent = rate;
  document.getElementById("stat-streak").textContent = state.streak;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function allParas(v) { return [...v.paras, ...(v.advanced || [])]; }
function isAdvanced(v, para) { return (v.advanced || []).includes(para); }

function setBanner(text) {
  if (!text) { banner.style.display = "none"; return; }
  banner.textContent = text;
  banner.style.display = "block";
}

let currentWord = null;
let revealed = false;

function render() {
  updateStats();
  const isEikenMode = state.mode === "eiken";
  const pool = filteredVocab();
  // Eiken mode: skip filter-based banner & empty checks (it shows static content)
  if (!isEikenMode) {
    if (state.level === "weak") {
      setBanner(`苦手復習モード: ${pool.length}語が対象`);
    } else if (state.level === "advanced") {
      setBanner(`高得点語モード: ${pool.length}語が対象`);
    } else if (state.source !== "all" || state.topic !== "all") {
      const parts = [];
      if (state.source === "eiken") parts.push("英検1級 過去問");
      else if (state.source === "topic") parts.push("トピック別");
      else if (state.source === "paraphrase") parts.push("パラフレ");
      if (state.topic !== "all") parts.push(state.topic);
      setBanner(`${parts.join(" · ")}: ${pool.length}語が対象`);
    } else {
      setBanner(null);
    }
    if (pool.length === 0) {
      cardEl.innerHTML = `<div style="text-align:center; padding:60px 20px; color:var(--text-muted)">
        この条件に該当する語がありません。<br>フィルターを変更してください。
      </div>`;
      return;
    }
  } else {
    setBanner(null);
  }

  cardEl.classList.toggle("list-mode", state.mode === "list" || state.mode === "eiken");
  // Show search bar only in list mode
  const searchBar = document.getElementById("search-bar-container");
  if (searchBar) searchBar.style.display = (state.mode === "list") ? "block" : "none";

  // Show/hide filter rows based on mode
  // - eiken mode: only the eiken-tab row is visible
  // - other modes: source/topic/pos/level visible
  const isEiken = state.mode === "eiken";
  const sourceRow = document.getElementById("source-row");
  const topicRow = document.getElementById("topic-row");
  const posRow = document.getElementById("pos-row");
  const levelRow = document.getElementById("level-row");
  if (sourceRow) sourceRow.style.display = isEiken ? "none" : "flex";
  if (posRow) posRow.style.display = isEiken ? "none" : "flex";
  if (levelRow) levelRow.style.display = isEiken ? "none" : "flex";
  // topicRow is also managed by renderTopicChips (hides on paraphrase source)
  if (topicRow && isEiken) topicRow.style.display = "none";
  else if (topicRow) renderTopicChips();
  // Stats bar visibility (hide in eiken mode since no quizzing)
  const statsBar = document.querySelector(".stats-bar");
  if (statsBar) statsBar.style.display = isEiken ? "none" : "flex";
  if (state.mode === "flashcard") renderFlashcard();
  else if (state.mode === "quiz-para") renderQuizPara();
  else if (state.mode === "quiz-base") renderQuizBase();
  else if (state.mode === "typing") renderTyping();
  else if (state.mode === "list") renderList();
  else if (state.mode === "eiken") renderEikenView();
}

function eikenNavHtml() {
  const tabs = [
    { id: "templates", label: "📝 Templates" },
    { id: "examples", label: "✍️ 解答例" },
    { id: "reasons", label: "💡 Reason Options" },
    { id: "correction", label: "🖍️ 添削" },
    { id: "words", label: "📚 単語" },
  ];
  const active = state.eikenTab || "templates";
  return `<div class="eiken-nav">
    ${tabs.map(t => `<button class="eiken-nav-btn ${t.id === active ? "active" : ""}" data-eiken-nav="${t.id}">${t.label}</button>`).join("")}
  </div>`;
}

function bindEikenNav() {
  cardEl.querySelectorAll("[data-eiken-nav]").forEach(btn => {
    btn.onclick = () => {
      state.eikenTab = btn.dataset.eikenNav;
      saveState();
      render();
    };
  });
}

function renderEikenView() {
  const tab = state.eikenTab || "templates";
  if (tab === "templates") renderEikenTemplates();
  else if (tab === "examples") renderEikenExamples();
  else if (tab === "reasons") renderEikenReasons();
  else if (tab === "correction") renderEikenCorrection();
  else if (tab === "words") renderEikenWords();
  else renderEikenTemplates();
  bindEikenNav();
}

let listSearchTerm = "";
function renderList() {
  const pool = filteredVocab();
  const term = listSearchTerm.trim().toLowerCase();
  const matches = pool.filter(v => {
    if (!term) return true;
    if (v.base.toLowerCase().includes(term)) return true;
    if (v.jp && v.jp.includes(term)) return true;
    if (v.topic && v.topic.includes(term)) return true;
    return allParas(v).some(p => p.toLowerCase().includes(term));
  });

  // Group: paraphrase entries by POS, term entries by topic
  const paraGroups = {}; // pos -> entries
  const termGroups = {}; // topic -> entries
  matches.forEach(v => {
    const src = v.source || "paraphrase";
    if (src === "paraphrase") {
      (paraGroups[v.pos] = paraGroups[v.pos] || []).push(v);
    } else {
      const groupKey = (src === "eiken" ? "🇬🇧 英検1級 過去問" : v.topic || "その他");
      (termGroups[groupKey] = termGroups[groupKey] || []).push(v);
    }
  });

  const order = ["verb", "noun", "adj", "adv"];
  const totalEntries = matches.length;

  // Update the top search bar's summary and input value (no re-creation)
  const topSummary = document.getElementById("list-summary-top");
  if (topSummary) {
    topSummary.textContent = `${totalEntries} エントリ${term ? ` · 検索: "${term}"` : ""}`;
  }

  let html = ``;

  if (matches.length === 0) {
    html += `<div class="list-empty">該当する語がありません</div>`;
  } else {
    // Paraphrase sections
    order.filter(p => paraGroups[p]).forEach(pos => {
      html += `<div class="list-pos-section">${posLabel(pos)} (${paraGroups[pos].length})</div>`;
      paraGroups[pos].forEach(v => {
        const paras = allParas(v);
        const stat = state.wordStats[v.base];
        const advCount = (v.advanced || []).length;
        html += `<div class="list-entry">
          <div class="list-entry-header">
            <span class="list-entry-base">${escapeHtml(v.base)}</span>
            <span class="list-entry-jp">${escapeHtml(v.jp)}</span>
            <span class="list-entry-meta">
              ${paras.length}語${advCount ? ` · 高得点${advCount}` : ""}
              ${stat && stat.marked ? `<span class="marked">復習</span>` : ""}
            </span>
          </div>
          <div class="list-entry-paras">
            ${paras.map(p => `<span class="para-pill ${isAdvanced(v,p) ? "advanced" : ""}">${escapeHtml(p)}</span>`).join("")}
          </div>
        </div>`;
      });
    });
    // Term sections (by topic)
    Object.keys(termGroups).sort().forEach(topic => {
      html += `<div class="list-pos-section">${escapeHtml(topic)} (${termGroups[topic].length})</div>`;
      // Sub-group by 'sub' if available
      const bySub = {};
      termGroups[topic].forEach(v => {
        const k = v.sub || "—";
        (bySub[k] = bySub[k] || []).push(v);
      });
      Object.keys(bySub).forEach(sub => {
        if (sub !== "—") {
          html += `<div style="font-size:0.7rem; color:var(--text-muted); margin:8px 0 4px; text-transform:uppercase; letter-spacing:0.08em; font-weight:600;">${escapeHtml(sub)}</div>`;
        }
        html += `<div class="eiken-vocab-grid">`;
        bySub[sub].forEach(v => {

}

// =========================================
// QUIZ (4-choice)
// =========================================
let quizState = {};
function pickFromList(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function quizSetup() {
  const v = currentWord;
  if (!v) return;
  const isTerm = (v.source === "eiken" || v.source === "topic");

  if (state.mode === "quiz-para") {
    if (isTerm) {
      const distractors = [];
      const usedJp = new Set([v.jp]);
      let guard = 0;
      while (distractors.length < 3 && guard++ < 300) {
        const other = pickRandomOther(v.base);
        if (!other || usedJp.has(other.jp)) continue;
        usedJp.add(other.jp);
        distractors.push({ text: other.jp, correct: false });
      }
      const choices = shuffle([{ text: v.jp, correct: true }, ...distractors]);
      quizState = { correctChoice: v.jp, choices, termMode: true };
      return;
    }
    const correctPara = pickFromList(allParas(v));
    const distractors = [];
    let guard = 0;
    while (distractors.length < 3 && guard++ < 300) {
      const other = pickRandomOther(v.base);
      if (!other || !allParas(other).length) continue;
      const opt = pickFromList(allParas(other));
      if (!allParas(v).includes(opt) && !distractors.find(d => d.text === opt)) {
        distractors.push({ text: opt, correct: false });
      }
    }
    const choices = shuffle([{ text: correctPara, correct: true }, ...distractors]);
    quizState = { correctChoice: correctPara, choices, termMode: false };
  } else if (state.mode === "quiz-base") {
    if (isTerm) {
      const distractors = [];
      const usedBases = new Set([v.base]);
      let guard = 0;
      while (distractors.length < 3 && guard++ < 300) {
        const other = pickRandomOther(v.base);
        if (!other || usedBases.has(other.base)) continue;
        usedBases.add(other.base);
        distractors.push({ text: other.base, jp: "", correct: false });
      }
      const choices = shuffle([{ text: v.base, jp: "", correct: true }, ...distractors]);
      quizState = { promptPara: v.jp, choices, termMode: true };
      return;
    }
    const promptPara = pickFromList(allParas(v));
    const distractors = [];
    const usedBases = new Set([v.base]);
    let guard = 0;
    while (distractors.length < 3 && guard++ < 300) {
      const other = pickRandomOther(v.base);
      if (!other || usedBases.has(other.base)) continue;
      usedBases.add(other.base);
      distractors.push({ text: other.base, jp: other.jp, correct: false });
    }
    const choices = shuffle([{ text: v.base, jp: v.jp, correct: true }, ...distractors]);
    quizState = { promptPara, choices, termMode: false };
  }
}

function renderQuizPara() {
  if (!currentWord) { currentWord = pickRandom(); quizSetup(); }
  if (!currentWord) return;
  const v = currentWord;
  const choices = quizState.choices;
  const isTermQuiz = quizState.termMode;
  const promptText = isTermQuiz ? "この英単語の意味は？" : "この語の同義語・パラフレーズはどれ？";
  const subInfo = isTermQuiz
    ? (v.source === "eiken" ? "EIKEN 1 · " + escapeHtml(v.sub || "") : escapeHtml(v.topic || ""))
    : `${escapeHtml(v.jp)} · ${posLabel(v.pos)}`;
  cardEl.innerHTML = `
    <div class="quiz-question">
      <div class="quiz-prompt">${promptText}</div>
      <div class="quiz-target">${escapeHtml(v.base)}</div>
      <div class="quiz-target-jp">${subInfo}</div>
    </div>
    <div class="quiz-choices" id="choices">
      ${choices.map((c, i) => `<button class="choice" data-choice="${i}">
        <span class="choice-key">${"ABCD"[i]}</span>
        <span class="choice-body">${escapeHtml(c.text)}</span>
      </button>`).join("")}
    </div>
    <div class="actions">
      <button class="btn ghost" id="skip-btn">スキップ →</button>
    </div>`;
  document.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => handleQuizAnswer(btn, choices);
  });
  document.getElementById("skip-btn").onclick = nextWord;
}

function renderQuizBase() {
  if (!currentWord) { currentWord = pickRandom(); quizSetup(); }
  if (!currentWord) return;
  const v = currentWord;
  const choices = quizState.choices;
  const promptPara = quizState.promptPara;
  const isTermQuiz = quizState.termMode;
  const promptText = isTermQuiz ? "この意味の英単語はどれ？" : "このパラフレーズに対応する基本語は？";
  const subInfo = isTermQuiz
    ? (v.source === "eiken" ? "EIKEN 1 · " + escapeHtml(v.sub || "") : escapeHtml(v.topic || ""))
    : posLabel(v.pos);
  cardEl.innerHTML = `
    <div class="quiz-question">
      <div class="quiz-prompt">${promptText}</div>
      <div class="quiz-target">${escapeHtml(promptPara)}</div>
      <div class="quiz-target-jp">${subInfo}</div>
    </div>
    <div class="quiz-choices" id="choices">
      ${choices.map((c, i) => `<button class="choice" data-choice="${i}">
        <span class="choice-key">${"ABCD"[i]}</span>
        <span class="choice-body">${escapeHtml(c.text)}<div class="choice-jp">${escapeHtml(c.jp || "")}</div></span>
      </button>`).join("")}
    </div>
    <div class="actions">
      <button class="btn ghost" id="skip-btn">スキップ →</button>
    </div>`;
  document.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => handleQuizAnswer(btn, choices);
  });
  document.getElementById("skip-btn").onclick = nextWord;
}

function handleQuizAnswer(btn, choices) {
  const idx = parseInt(btn.dataset.choice);
  const chosen = choices[idx];
  const v = currentWord;
  const stat = getStat(v.base);
  stat.seen++; state.seen++;
  document.querySelectorAll(".choice").forEach((b, i) => {
    b.disabled = true;
    if (choices[i].correct) b.classList.add("correct");
    if (i === idx && !choices[i].correct) b.classList.add("wrong");
  });
  if (chosen.correct) {
    stat.correct++; state.correct++; state.streak++;
  } else {
    state.streak = 0;
    stat.marked = true;
  }
  saveState(); updateStats();
  const actions = cardEl.querySelector(".actions");
  actions.innerHTML = `<button class="btn primary" id="next-btn">次へ →</button>`;
  document.getElementById("next-btn").onclick = nextWord;
  if (historyIdx >= 0 && history[historyIdx]) {
    history[historyIdx].answered = true;
    history[historyIdx].answeredChoice = { idx, correct: chosen.correct };
    history[historyIdx].quizState = JSON.parse(JSON.stringify(quizState || {}));
  }
}

let typingShown = new Set();
function renderTyping() {

  const v = currentWord;
  const isTerm = (v.source === "eiken" || v.source === "topic");

    const sourceLabel = v.source === "eiken" ? `EIKEN 1 · ${escapeHtml(v.sub || "")}` : escapeHtml(v.topic || "");

        <div class="word-main" style="font-size:1.6rem">${escapeHtml(v.jp)}</div>
        <div class="word-jp" style="margin-top:6px">↓ この意味の英単語を入力</div>
      </div>
      <div style="padding:16px 0">
        <input class="typing-input" id="typing-input" placeholder="英語で入力 (Enter)" autocomplete="off" autofocus>
        <div class="typing-feedback" id="typing-feedback"></div>
      </div>
      <div class="paraphrases">
        <span class="${found ? 'para-pill' : 'hint-pill'}" style="${found ? '' : 'filter:blur(6px);'}">${escapeHtml(v.base)}</span>
      </div>
      <div class="actions">
        <button class="btn" id="show-rest-btn">答えを表示</button>
        <button class="btn primary" id="next-btn">次へ →</button>
      </div>`;
    const input = document.getElementById("typing-input");
    const feedback = document.getElementById("typing-feedback");
    input.focus();
    input.onkeydown = (e) => {
      if (e.key === "Enter") {
        const val = input.value.trim().toLowerCase();
        if (!val) return;
        if (val === v.base.toLowerCase()) {
          typingShown.add(v.base.toLowerCase());
          feedback.textContent = `✓ 正解: ${v.base}`;
          feedback.className = "typing-feedback correct";
          getStat(v.base).correct++; state.correct++; state.seen++; state.streak++;
          saveState(); updateStats();
          setTimeout(nextWord, 600);
        } else {
          feedback.textContent = "✗ 不正解";
          feedback.className = "typing-feedback wrong";
          state.streak = 0; saveState(); updateStats();
        }
        input.value = "";
      }
    };
    document.getElementById("show-rest-btn").onclick = () => { typingShown.add(v.base.toLowerCase()); render(); };
    document.getElementById("next-btn").onclick = nextWord;
    return;
  }

  const paras = allParas(v);
  cardEl.innerHTML = `
    <div class="word-header">
      <div class="word-category">${posLabel(v.pos)}</div>
      <div class="word-main">${escapeHtml(v.base)}</div>
      <div class="word-jp">${escapeHtml(v.jp)}</div>
    </div>
    <div style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-bottom:8px;">
      パラフレーズを思い出して入力 (${typingShown.size} / ${paras.length} 発見)
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${(typingShown.size / paras.length) * 100}%"></div>
    </div>
    <div style="padding:16px 0">
      <input class="typing-input" id="typing-input" placeholder="パラフレーズを入力 (Enter)" autocomplete="off" autofocus>
      <div class="typing-feedback" id="typing-feedback"></div>
    </div>
    <div class="paraphrases">
      ${paras.map(p => {
        const found = typingShown.has(p.toLowerCase());
        if (found) return `<span class="para-pill ${isAdvanced(v,p) ? "advanced" : ""}">${escapeHtml(p)}</span>`;
        const initial = p.charAt(0).toUpperCase();
        const rest = p.slice(1).replace(/[a-zA-Z]/g, "_").replace(/_/g, "·");
        return `<span class="hint-pill ${isAdvanced(v,p) ? "advanced" : ""}"><span class="hint-initial">${escapeHtml(initial)}</span>${escapeHtml(rest)}</span>`;
      }).join("")}
    </div>
    <div class="actions">
      <button class="btn" id="show-rest-btn">残りを表示</button>
      <button class="btn primary" id="next-btn">次の語へ →</button>
    </div>`;
  const input = document.getElementById("typing-input");
  const feedback = document.getElementById("typing-feedback");
  input.focus();
  input.onkeydown = (e) => {
    if (e.key === "Enter") {
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      const matched = paras.find(p => p.toLowerCase() === val);
      if (matched) {
        if (typingShown.has(matched.toLowerCase())) {
          feedback.textContent = "🔁 すでに入力済み";
          feedback.className = "typing-feedback partial";
        } else {
          typingShown.add(matched.toLowerCase());
          feedback.textContent = `✓ 正解: ${matched}`;
          feedback.className = "typing-feedback correct";
          getStat(v.base).correct++; state.correct++; state.seen++; state.streak++;
          saveState(); updateStats();
          setTimeout(() => render(), 400);
        }
      } else {
        feedback.textContent = "✗ 該当なし";
        feedback.className = "typing-feedback wrong";
        state.streak = 0; saveState(); updateStats();
      }
      input.value = "";
    }
  };
  document.getElementById("show-rest-btn").onclick = () => { paras.forEach(p => typingShown.add(p.toLowerCase())); render(); };
  document.getElementById("next-btn").onclick = nextWord;
}

// =========================================
// HISTORY NAVIGATION
// =========================================
let history = [];
let historyIdx = -1;

function restoreFromHistory(entry) {
  currentWord = entry.word;
  quizState = entry.quizState || {};
  revealed = entry.revealed;
  typingShown = new Set(entry.typingShown || []);
}

function updateHistoryDisplay() {
  const el = document.getElementById("history-pos");
  if (!el) return;
  if (history.length === 0) { el.textContent = ""; return; }
  el.textContent = `履歴 ${historyIdx + 1} / ${history.length}`;
}

function nextWord() {
  if (historyIdx < history.length - 1) {
    historyIdx++;
    restoreFromHistory(history[historyIdx]);
    render();
    if (history[historyIdx].answered && (state.mode === "quiz-para" || state.mode === "quiz-base")) {
      reapplyAnsweredState(history[historyIdx]);
    }
    updateHistoryDisplay();
    return;
  }
  const newWord = pickRandom();
  if (!newWord) { currentWord = null; render(); updateHistoryDisplay(); return; }
  currentWord = newWord;
  revealed = false;
  typingShown = new Set();
  quizSetup();
  history.push({
    word: currentWord,
    quizState: JSON.parse(JSON.stringify(quizState || {})),
    revealed: false,
    typingShown: new Set(),
    answered: false,
  });
  if (history.length > 100) history.shift();
  historyIdx = history.length - 1;
  render();
  updateHistoryDisplay();
}

function prevWord() {
  if (historyIdx <= 0) { toast("これ以上戻れません"); return; }
  historyIdx--;
  restoreFromHistory(history[historyIdx]);
  render();
  if (history[historyIdx].answered && (state.mode === "quiz-para" || state.mode === "quiz-base")) {
    reapplyAnsweredState(history[historyIdx]);
  }
  updateHistoryDisplay();
}

function reapplyAnsweredState(entry) {
  const choices = cardEl.querySelectorAll(".choice");
  const choicesData = entry.quizState.choices || [];
  choices.forEach((b, i) => {
    b.disabled = true;
    if (choicesData[i] && choicesData[i].correct) b.classList.add("correct");
  });
  if (entry.answeredChoice && !entry.answeredChoice.correct) {
    const wrong = cardEl.querySelector(`.choice[data-choice="${entry.answeredChoice.idx}"]`);
    if (wrong) wrong.classList.add("wrong");
  }
  const actions = cardEl.querySelector(".actions");
  if (actions) actions.innerHTML = `<button class="btn primary" id="next-btn">次へ →</button>`;
  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) nextBtn.onclick = nextWord;
}

function toast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.remove("show"), 1400);
}

// =========================================
// HELPERS
// =========================================
function posLabel(pos) {
  return { verb: "動詞 (Verb)", noun: "名詞 (Noun)", adj: "形容詞 (Adjective)", adv: "副詞 (Adverb)", term: "用語 (Term)" }[pos] || pos;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// =========================================
// KEYBOARD SHORTCUTS
// =========================================
document.addEventListener("keydown", (e) => {
  const isInput = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  if (isInput) {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === "ArrowRight") { e.preventDefault(); nextWord(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); prevWord(); return; }
    }
    return;
  }

  if (state.mode === "quiz-para" || state.mode === "quiz-base") {
    let idx = -1;
    const k = e.key.toLowerCase();
    if (["a","b","c","d"].includes(k)) idx = ["a","b","c","d"].indexOf(k);
    else if (["1","2","3","4"].includes(e.key)) idx = parseInt(e.key) - 1;
    if (idx >= 0) {
      const btn = document.querySelector(`.choice[data-choice="${idx}"]`);
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); return; }
    }
  }

  if (e.key.toLowerCase() === "r") {
    const revealBtn = document.getElementById("reveal-btn");
    if (revealBtn) { e.preventDefault(); revealBtn.click(); return; }
    const showRestBtn = document.getElementById("show-rest-btn");
    if (showRestBtn) { e.preventDefault(); showRestBtn.click(); return; }
  }

  if (e.key === "0") {
    if (currentWord) {
      const stat = getStat(currentWord.base);
      stat.marked = true;
      saveState();
      toast(`「${currentWord.base}」を復習リストに追加`);
      if (state.mode === "flashcard") render();
    }
    e.preventDefault();
    return;
  }

  if (state.mode === "eiken" || state.mode === "list") return;

  if (e.key === "ArrowRight" || e.key === "Enter") {
    if (state.mode === "flashcard" && !revealed) {
      const revealBtn = document.getElementById("reveal-btn");
      if (revealBtn) { e.preventDefault(); revealBtn.click(); return; }
    }
    e.preventDefault();
    nextWord();
    return;
  }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevWord();
    return;
  }
  if (e.key.toLowerCase() === "m") {
    if (currentWord) {
      const stat = getStat(currentWord.base);
      stat.marked = !stat.marked;
      saveState();
      toast(stat.marked ? "復習マーク追加" : "復習マーク解除");
      if (state.mode === "flashcard") render();
    }
    e.preventDefault();
  }
});

function updateKbdContext() {
  const el = document.getElementById("kbd-context");
  if (!el) return;
  if (state.mode === "quiz-para" || state.mode === "quiz-base") {
    el.innerHTML = `<kbd>A</kbd>-<kbd>D</kbd> / <kbd>1</kbd>-<kbd>4</kbd> 選択<span class="kbd-sep">·</span>`;
  } else if (state.mode === "flashcard") {
    el.innerHTML = `<kbd>R</kbd> 表示<span class="kbd-sep">·</span>`;
  } else if (state.mode === "list") {
    el.innerHTML = `検索: 上の検索欄<span class="kbd-sep">·</span>`;
  } else if (state.mode === "eiken") {
    el.innerHTML = `テンプレ + 過去問単語<span class="kbd-sep">·</span>`;
  } else {
    el.innerHTML = ``;
  }
}
const origRender = render;
render = function() { origRender(); updateKbdContext(); };

// Init
bindTopSearch();
nextWord();
</script>
</body>
</html>
